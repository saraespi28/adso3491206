<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>09-tables</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        table{
            border-collapse:collapse;
            width: 100%;
            thead{
                th{
                    background-color: #eb7d4b8e;
                    padding: 0.4rem 0.6rem;
                }
            }
            tbody{
                tr{
                    &:first-of-type{
                        border-top: 1px solid #fff;
                    }
                    &:nth-child(even){
                        background-color: #fff3;
                    }
                    td{
                        border-bottom: 1px solid #fff;
                        font-size: 0.8rem;
                        padding: 0.4rem;
                    }
                }
            }
            tfoot{
                td{
                    background-color: #eb6c188a;
                    padding: 0.4rem 0.6rem;
                    font-size: 0.8rem;
                    text-align:center;
                }
            }
        }
    </style>
</head>
<body class="html">

        </a>
    </nav>

                        <th>Nombre</th>

                </thead>
                <tbody>
                    <tr>
                        <td align="center">Chanchito</td>

                    <tr>
                        <td align="center">Chanchito</td>

                    </tr>

        </section>
    </main>
