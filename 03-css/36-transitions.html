<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>36-transitions</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section {
            img {
                display: block;
                margin: 1rem auto;

                &.transition01 {
                    transition: transform 0.5s ease-in;

                    &:hover {
                        transform: scale(1.3);
                    }
                }

                &.transition02 {
                    transition: all 1s linear;

                    &:hover {
                        transform: rotate(-0.5turn); /*-180deg*/
                    }
                }
                &.transition03 {
                    transition: transform 0.5s ease-in-out;

                    &:hover {
                        transform: rotateY(180deg);
                    }
                }

                &.transition04 {
                    transition: transform 0.2s ease;

                    &:hover {
                        transform: translateX(80px);
                    }
                }
            }
        }
    </style>
</head>
<body class="css"> 
    <nav class="back">
        <a href="index.html">
            <svg xmlns="<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="white" viewBox="0 0 256 256"><path d="M224,128a8,8,0,0,1-8,8H59.31l58.35,58.34a8,8,0,0,1-11.32,11.32l-72-72a8,8,0,0,1,0-11.32l72-72a8,8,0,0,1,11.32,11.32L59.31,120H216A8,8,0,0,1,224,128Z"></path></svg>
        </a>
    </nav>
    <main>
        <header class="mainmenu internal">
            <h1>36-transitions</h1>
            <img src="../img/logo-css.png" alt="css">
            <h3>Enable you to define the transition between two states of an element.</h3>
        </header>
        <section>
            <h2 class="subtitle">Scale(1.3):</h2>
            <img class="transition01" src="../img/dk (1).png" alt="DK">
            <h2 class="subtitle">Rotate(-0.5turn):</h2>
            <img class="transition02" src="../img/dk (1).png" alt="DK">
            <h2 class="subtitle">RotateY(180deg):</h2>
            <img class="transition03" src="../img/dk (1).png" alt="DK">
            <h2 class="subtitle">TranslateX(80px):</h2>
            <img class="transition04" src="../img/dk (1).png" alt="DK">
            <h2 class="subtitle">Multiple:</h2>
            <div class="box"></div>
        </section>
        </main>
</body>
</html>
