<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>35-Transformations</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section{
            img{
                display: block;
                margin: 2rem auto;
                &.transform1 {
                    transform: rotate(90deg);
                }
                &.transform2 {
                    transform: scale(0.5);
                }
                &.transform3 {
                    transform: translateX(-100px);
                }
                &.transform4 {
                    transform: skew(30deg);
                }
                &.transform5 {
                    transform: rotate(45deg) scale(1.2);
                }
            }
        }
    </style>
</head>

    <main>
        <header class="mainmenu internal">
            <h1>35-Transformations</h1>
            <img src="../img/logo-css.png" alt="css">
            <h3>Propiedad (transform) que permite la manipulación 2D o 3D de elementos, como translate(), rotate(), scale() y skew().</h3>
        </header>
        <section>
            <h2 class="subtitle">Rotate: 90deg</h2>
            <img class="transform1" src="../img/mario.png" width="180px">
            <h2 class="subtitle">Scale: 0.5</h2>
            <img class="transform2" src="../img/mario.png" width="180px">
            <h2 class="subtitle">TranslateX: -100px</h2>
            <img class="transform3" src="../img/mario.png" width="180px">
            <h2 class="subtitle">Skew: 30deg</h2>
            <img class="transform4" src="../img/mario.png" width="180px">
            <h2 class="subtitle">Rotate Scale:</h2>
            <img class="transform5" src="../img/mario.png" width="180px">
        </section>
