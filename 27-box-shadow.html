<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>27-box shadow</title>
    <link rel="stylesheet" href="../src/css/styles.css">
    <style>
        section {
            div.box {
                border: 4px solid #fff9;
                height: 140px;
                margin: 2rem auto;
                width: 240px;
                &.box1 {
                    box-shadow: 0 0 12px #fff;
                }
                  &.box2 {
                    box-shadow: -10px -10px 24px #fff;
                }
                  &.box3 {
                    box-shadow: 0 0 20px #fff inset;
                }
                &.box4 {
                    border-radius: 50%;
                    height: 140px;
                    width: 140px;
                    box-shadow: 5px 0px 10px #ff0,
                                15px 0px 10px #00f,
                                20px 20px 10px #ff0a0a;
                }
            }
            div.images {
                img {
                    width: 180px;
                    &:first-child {
                        box-shadow: 0 0 12px #fff;
                    }
                    &:last-child {
                        filter: drop-shadow(0 0 12px #fff);
                    }
                }
            }
        }
    </style>
</head>
<body class="css">

            <h1>27-box shadow</h1>
            <img src="../img/logo-css.png" alt="css">
            <h3>Description.</h3>
        </header>
        <section>
                  <h2 class="subtitle">box-shadow: 0 0 12px #fff</h2>
            <div class="box box1"></div>
            <h2 class="subtitle">box-shadow: -10px -10px 24px 0 #fff</h2>                                                                                                                                                      
            <div class="box box2"></div>
            <h2 class="subtitle">box-shadow: 0 0 20px #fff inset</h2>
            <div class="box box3"></div>
            <h2 class="subtitle">box-shadow: multiple</h2>
            <div class="box box4"></div>
            <h2 class="subtitle">box-shadow VS drop-shadow()</h2>
